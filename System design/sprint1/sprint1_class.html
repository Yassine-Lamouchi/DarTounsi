<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarTounsi — Sprint 1: Class Diagram</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 5px; }
  h2 { text-align: center; font-size: 14px; color: #666; font-weight: normal; margin-top: 0; }
  .diagram-container { display: flex; justify-content: center; overflow: auto; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<h1>DarTounsi — Sprint 1: Identity &amp; Trust</h1>
<h2>Class Diagram (UML 2.0)</h2>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <marker id="diamond-filled" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 5, 7 0, 14 5, 7 10" fill="#333" stroke="#333" stroke-width="1"/>
    </marker>
    <marker id="diamond-open" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 5, 7 0, 14 5, 7 10" fill="#fff" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-inherit" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0 0, 16 6, 0 12" fill="#fff" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-dep" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ===== User Class ===== -->
  <rect x="80" y="40" width="320" height="310" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <!-- Class name -->
  <rect x="80" y="40" width="320" height="35" rx="4" fill="#e85d04"/>
  <text x="240" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">User</text>
  <!-- Attributes -->
  <line x1="80" y1="75" x2="400" y2="75" stroke="#e85d04" stroke-width="1"/>
  <text x="90" y="93" font-size="11" fill="#333">- id : int</text>
  <text x="90" y="108" font-size="11" fill="#333">- name : string</text>
  <text x="90" y="123" font-size="11" fill="#333">- email : string</text>
  <text x="90" y="138" font-size="11" fill="#333">- password_hash : string</text>
  <text x="90" y="153" font-size="11" fill="#333">- avatar_url : string</text>
  <text x="90" y="168" font-size="11" fill="#333">- banner_url : string</text>
  <text x="90" y="183" font-size="11" fill="#333">- description : text</text>
  <text x="90" y="198" font-size="11" fill="#333">- location : string</text>
  <text x="90" y="213" font-size="11" fill="#333">- role : «enumeration» UserRole</text>
  <text x="90" y="228" font-size="11" fill="#333">- google_id : string</text>
  <text x="90" y="243" font-size="11" fill="#333">- phone : string</text>
  <text x="90" y="258" font-size="11" fill="#333">- is_verified : boolean</text>
  <text x="90" y="273" font-size="11" fill="#333">- lifestyle_prefs : JSON</text>
  <text x="90" y="288" font-size="11" fill="#333">- created_at : datetime</text>
  <!-- Methods -->
  <line x1="80" y1="295" x2="400" y2="295" stroke="#e85d04" stroke-width="1"/>
  <text x="90" y="313" font-size="11" fill="#333">+ register(name, email, password, role) : User</text>
  <text x="90" y="328" font-size="11" fill="#333">+ login(email, password) : User</text>
  <text x="90" y="343" font-size="11" fill="#333">+ updateProfile(fields) : void</text>

  <!-- ===== UserRole Enumeration ===== -->
  <rect x="80" y="390" width="230" height="140" rx="4" fill="#f0f8ff" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="80" y="390" width="230" height="30" rx="4" fill="#4a90d9"/>
  <text x="195" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">«enumeration» UserRole</text>
  <line x1="80" y1="420" x2="310" y2="420" stroke="#4a90d9" stroke-width="1"/>
  <text x="90" y="438" font-size="11" fill="#333">tenant</text>
  <text x="90" y="453" font-size="11" fill="#333">owner</text>
  <text x="90" y="468" font-size="11" fill="#333">hotel_manager</text>
  <text x="90" y="483" font-size="11" fill="#333">admin</text>
  <text x="90" y="498" font-size="11" fill="#333">super_admin</text>

  <!-- ===== MatchmakingProfile Class ===== -->
  <rect x="450" y="40" width="310" height="310" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <rect x="450" y="40" width="310" height="35" rx="4" fill="#e85d04"/>
  <text x="605" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">MatchmakingProfile</text>
  <line x1="450" y1="75" x2="760" y2="75" stroke="#e85d04" stroke-width="1"/>
  <text x="460" y="93" font-size="11" fill="#333">- id : int</text>
  <text x="460" y="108" font-size="11" fill="#333">- user_id : int</text>
  <text x="460" y="123" font-size="11" fill="#333">- sleep_schedule : enum</text>
  <text x="460" y="138" font-size="11" fill="#333">- noise_level : enum</text>
  <text x="460" y="153" font-size="11" fill="#333">- is_smoker : boolean</text>
  <text x="460" y="168" font-size="11" fill="#333">- pets_allowed : boolean</text>
  <text x="460" y="183" font-size="11" fill="#333">- cleanliness : enum</text>
  <text x="460" y="198" font-size="11" fill="#333">- guest_policy : enum</text>
  <text x="460" y="213" font-size="11" fill="#333">- budget_min : decimal</text>
  <text x="460" y="228" font-size="11" fill="#333">- budget_max : decimal</text>
  <text x="460" y="243" font-size="11" fill="#333">- preferred_city : string</text>
  <text x="460" y="258" font-size="11" fill="#333">- preferred_neighborhood : string</text>
  <text x="460" y="273" font-size="11" fill="#333">- bio : text</text>
  <line x1="450" y1="285" x2="760" y2="285" stroke="#e85d04" stroke-width="1"/>
  <text x="460" y="303" font-size="11" fill="#333">+ save(data) : void</text>
  <text x="460" y="318" font-size="11" fill="#333">+ getProfile(userId) : MatchmakingProfile</text>
  <text x="460" y="333" font-size="11" fill="#333">+ calculateCompatibility(other) : float</text>

  <!-- ===== Notification Class ===== -->
  <rect x="830" y="40" width="300" height="230" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <rect x="830" y="40" width="300" height="35" rx="4" fill="#e85d04"/>
  <text x="980" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Notification</text>
  <line x1="830" y1="75" x2="1130" y2="75" stroke="#e85d04" stroke-width="1"/>
  <text x="840" y="93" font-size="11" fill="#333">- id : int</text>
  <text x="840" y="108" font-size="11" fill="#333">- user_id : int</text>
  <text x="840" y="123" font-size="11" fill="#333">- type : string</text>
  <text x="840" y="138" font-size="11" fill="#333">- title : string</text>
  <text x="840" y="153" font-size="11" fill="#333">- message : text</text>
  <text x="840" y="168" font-size="11" fill="#333">- link : string</text>
  <text x="840" y="183" font-size="11" fill="#333">- is_read : boolean</text>
  <text x="840" y="198" font-size="11" fill="#333">- created_at : datetime</text>
  <line x1="830" y1="208" x2="1130" y2="208" stroke="#e85d04" stroke-width="1"/>
  <text x="840" y="226" font-size="11" fill="#333">+ markRead() : void</text>
  <text x="840" y="241" font-size="11" fill="#333">+ markAllRead(userId) : void</text>
  <text x="840" y="256" font-size="11" fill="#333">+ notify(userId, type, title, msg) : void</text>

  <!-- ===== Property Class (Sprint 1: listing management) ===== -->
  <rect x="450" y="420" width="310" height="250" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <rect x="450" y="420" width="310" height="35" rx="4" fill="#e85d04"/>
  <text x="605" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Property</text>
  <line x1="450" y1="455" x2="760" y2="455" stroke="#e85d04" stroke-width="1"/>
  <text x="460" y="473" font-size="11" fill="#333">- id : int</text>
  <text x="460" y="488" font-size="11" fill="#333">- owner_id : int</text>
  <text x="460" y="503" font-size="11" fill="#333">- title : string</text>
  <text x="460" y="518" font-size="11" fill="#333">- description : text</text>
  <text x="460" y="533" font-size="11" fill="#333">- type : «enumeration» PropertyType</text>
  <text x="460" y="548" font-size="11" fill="#333">- price : decimal</text>
  <text x="460" y="563" font-size="11" fill="#333">- city : string</text>
  <text x="460" y="578" font-size="11" fill="#333">- status : «enumeration» PropertyStatus</text>
  <line x1="450" y1="590" x2="760" y2="590" stroke="#e85d04" stroke-width="1"/>
  <text x="460" y="608" font-size="11" fill="#333">+ create(data) : Property</text>
  <text x="460" y="623" font-size="11" fill="#333">+ update(fields) : void</text>
  <text x="460" y="638" font-size="11" fill="#333">+ delete() : void</text>
  <text x="460" y="653" font-size="11" fill="#333">+ getMyProperties(ownerId) : Property[]</text>

  <!-- ===== Session Manager (controller) ===== -->
  <rect x="830" y="340" width="300" height="160" rx="4" fill="#f0fff0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="830" y="340" width="300" height="30" rx="4" fill="#2e7d32"/>
  <text x="980" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">«controller» AuthController</text>
  <line x1="830" y1="370" x2="1130" y2="370" stroke="#2e7d32" stroke-width="1"/>
  <text x="840" y="388" font-size="11" fill="#333">- session_id : string</text>
  <text x="840" y="403" font-size="11" fill="#333">- user_id : int</text>
  <line x1="830" y1="413" x2="1130" y2="413" stroke="#2e7d32" stroke-width="1"/>
  <text x="840" y="431" font-size="11" fill="#333">+ authLogin(email, password) : User</text>
  <text x="840" y="446" font-size="11" fill="#333">+ authRegister(data) : User</text>
  <text x="840" y="461" font-size="11" fill="#333">+ authGoogle(email, name) : User</text>
  <text x="840" y="476" font-size="11" fill="#333">+ authLogout() : void</text>
  <text x="840" y="491" font-size="11" fill="#333">+ authSession() : User | null</text>

  <!-- ===== Relationships ===== -->
  <!-- User 1 -- 0..1 MatchmakingProfile (composition) -->
  <line x1="400" y1="160" x2="450" y2="160" stroke="#333" stroke-width="1.5" marker-start="url(#diamond-filled)"/>
  <text x="402" y="148" font-size="10" fill="#555">1</text>
  <text x="438" y="148" font-size="10" fill="#555">0..1</text>

  <!-- User 1 -- * Notification -->
  <line x1="400" y1="100" x2="830" y2="100" stroke="#333" stroke-width="1.5" marker-start="url(#diamond-filled)"/>
  <text x="402" y="92" font-size="10" fill="#555">1</text>
  <text x="815" y="92" font-size="10" fill="#555">*</text>

  <!-- User -- UserRole -->
  <line x1="240" y1="350" x2="240" y2="390" stroke="#333" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-dep)"/>

  <!-- User 1 -- * Property -->
  <line x1="400" y1="300" x2="420" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="420" y2="520" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="520" x2="450" y2="520" stroke="#333" stroke-width="1.5" marker-start="url(#diamond-filled)"/>
  <text x="423" y="330" font-size="10" fill="#555">1</text>
  <text x="430" y="512" font-size="10" fill="#555">*</text>
  <text x="405" y="418" font-size="10" fill="#555" font-style="italic">owns</text>

  <!-- AuthController ..> User (dependency) -->
  <line x1="830" y1="420" x2="400" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-dep)"/>
  <text x="620" y="325" font-size="10" fill="#555" font-style="italic">«use»</text>

</svg>
</div>
</body>
</html>
