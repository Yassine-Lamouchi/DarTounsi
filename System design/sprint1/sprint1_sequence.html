<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarTounsi — Sprint 1: Sequence Diagram</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 5px; }
  h2 { text-align: center; font-size: 14px; color: #666; font-weight: normal; margin-top: 0; }
  .diagram-container { display: flex; justify-content: center; overflow: auto; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<h1>DarTounsi — Sprint 1: Identity &amp; Trust</h1>
<h2>Sequence Diagram — Registration &amp; Login Flow (UML 2.0)</h2>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 900" width="1050" height="900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ===== Lifelines ===== -->
  <!-- Visitor -->
  <rect x="60" y="30" width="100" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="110" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:Visitor</text>
  <line x1="110" y1="65" x2="110" y2="870" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- SPA Frontend -->
  <rect x="240" y="30" width="120" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="300" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:SPA (app.js)</text>
  <line x1="300" y1="65" x2="300" y2="870" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- API -->
  <rect x="460" y="30" width="120" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="520" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:API (api.php)</text>
  <line x1="520" y1="65" x2="520" y2="870" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Database -->
  <rect x="680" y="30" width="120" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="740" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:Database</text>
  <line x1="740" y1="65" x2="740" y2="870" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Google API -->
  <rect x="870" y="30" width="120" height="35" rx="4" fill="#4a90d9" stroke="#357abd" stroke-width="1.5"/>
  <text x="930" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:Google API</text>
  <line x1="930" y1="65" x2="930" y2="870" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== Fragment: Registration ===== -->
  <rect x="50" y="85" width="870" height="280" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="85" width="80" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">alt</text>
  <text x="140" y="100" font-size="10" fill="#555">[Email Registration]</text>

  <!-- Activation bars -->
  <rect x="105" y="115" width="10" height="240" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="295" y="120" width="10" height="230" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="515" y="140" width="10" height="90" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="735" y="155" width="10" height="55" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <!-- 1. Fill registration form -->
  <line x1="115" y1="125" x2="295" y2="125" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="170" y="120" font-size="10" fill="#333">1: fillForm(name, email, password, role)</text>

  <!-- 2. POST register -->
  <line x1="305" y1="145" x2="515" y2="145" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="140" font-size="10" fill="#333">2: POST api.php?route=auth&amp;action=register</text>

  <!-- 3. Check email unique -->
  <line x1="525" y1="160" x2="735" y2="160" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="580" y="155" font-size="10" fill="#333">3: SELECT * FROM users WHERE email = ?</text>

  <!-- 4. Email available -->
  <line x1="735" y1="180" x2="525" y2="180" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="590" y="175" font-size="10" fill="#555">4: null (not found)</text>

  <!-- 5. Insert user -->
  <rect x="735" y="195" width="10" height="30" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <line x1="525" y1="200" x2="735" y2="200" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="570" y="195" font-size="10" fill="#333">5: INSERT INTO users(...)</text>

  <!-- 6. User created -->
  <line x1="735" y1="218" x2="525" y2="218" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="600" y="215" font-size="10" fill="#555">6: user record</text>

  <!-- 7. Create session + return user -->
  <line x1="515" y1="240" x2="305" y2="240" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="340" y="235" font-size="10" fill="#555">7: {user, message: "Registration successful"}</text>

  <!-- 8. Show dashboard -->
  <line x1="295" y1="260" x2="115" y2="260" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="150" y="255" font-size="10" fill="#555">8: navigate(#/dashboard)</text>

  <!-- Self: create welcome notification -->
  <line x1="525" y1="280" x2="575" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="575" y1="280" x2="575" y2="300" stroke="#333" stroke-width="1"/>
  <line x1="575" y1="300" x2="525" y2="300" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="580" y="292" font-size="9" fill="#555">9: notify("Welcome!")</text>

  <!-- Dashed line alt separator for Google -->
  <line x1="50" y1="330" x2="920" y2="330" stroke="#333" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="140" y="348" font-size="10" fill="#555">[Google OAuth Login]</text>

  <!-- Activation bars for Google flow -->
  <rect x="105" y="355" width="10" height="90" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="295" y="355" width="10" height="90" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <!-- Click Google button -->
  <line x1="115" y1="360" x2="295" y2="360" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="155" y="355" font-size="10" fill="#333">10: click "Login with Google"</text>

  <!-- SPA simulates Google auth -->
  <line x1="305" y1="385" x2="515" y2="385" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="380" font-size="10" fill="#333">11: POST route=auth&amp;action=google</text>

  <rect x="515" y="380" width="10" height="40" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="735" y="388" width="10" height="20" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <line x1="525" y1="393" x2="735" y2="393" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="575" y="388" font-size="10" fill="#333">12: SELECT/INSERT user</text>
  <line x1="735" y1="405" x2="525" y2="405" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="605" y="402" font-size="10" fill="#555">13: user object</text>

  <line x1="515" y1="420" x2="305" y2="420" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="340" y="417" font-size="10" fill="#555">14: {user, "Login successful"}</text>

  <line x1="295" y1="440" x2="115" y2="440" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="150" y="435" font-size="10" fill="#555">15: navigate(#/dashboard)</text>

  <!-- ===== Fragment: Lifestyle Questionnaire ===== -->
  <rect x="50" y="470" width="730" height="180" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="470" width="60" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="485" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ref</text>
  <text x="120" y="485" font-size="10" fill="#555">Complete Lifestyle Questionnaire</text>

  <rect x="105" y="500" width="10" height="140" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="295" y="505" width="10" height="130" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="515" y="525" width="10" height="60" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="735" y="535" width="10" height="35" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <line x1="115" y1="510" x2="295" y2="510" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="140" y="505" font-size="10" fill="#333">1: fillQuestionnaire(sleep, noise, ...)</text>

  <line x1="305" y1="530" x2="515" y2="530" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="525" font-size="10" fill="#333">2: POST route=matchmaking&amp;action=profile</text>

  <line x1="525" y1="540" x2="735" y2="540" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="570" y="535" font-size="10" fill="#333">3: INSERT/UPDATE matchmaking_profiles</text>

  <line x1="735" y1="560" x2="525" y2="560" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="600" y="557" font-size="10" fill="#555">4: success</text>

  <line x1="515" y1="580" x2="305" y2="580" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="360" y="577" font-size="10" fill="#555">5: {message: "Profile saved"}</text>

  <line x1="295" y1="610" x2="115" y2="610" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="150" y="607" font-size="10" fill="#555">6: showToast("Saved!")</text>

  <!-- ===== Fragment: View Dashboard ===== -->
  <rect x="50" y="670" width="730" height="190" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="670" width="60" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ref</text>
  <text x="120" y="685" font-size="10" fill="#555">View Dashboard (Bento Grid)</text>

  <rect x="105" y="700" width="10" height="145" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="295" y="705" width="10" height="135" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="515" y="720" width="10" height="60" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="735" y="726" width="10" height="35" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <line x1="115" y1="710" x2="295" y2="710" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="155" y="705" font-size="10" fill="#333">1: navigate(#/dashboard)</text>

  <line x1="305" y1="730" x2="515" y2="730" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="330" y="725" font-size="10" fill="#333">2: GET route=properties&amp;action=my</text>

  <line x1="525" y1="730" x2="735" y2="730" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="575" y="725" font-size="10" fill="#333">3: SELECT * FROM properties WHERE owner_id=?</text>

  <line x1="735" y1="755" x2="525" y2="755" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="600" y="752" font-size="10" fill="#555">4: properties[]</text>

  <line x1="515" y1="775" x2="305" y2="775" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="370" y="772" font-size="10" fill="#555">5: {data: properties[]}</text>

  <line x1="295" y1="800" x2="115" y2="800" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="140" y="797" font-size="10" fill="#555">6: render bento-grid layout</text>

</svg>
</div>
</body>
</html>
