<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarTounsi — Sprint 2: Activity Diagram</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 5px; }
  h2 { text-align: center; font-size: 14px; color: #666; font-weight: normal; margin-top: 0; }
  .diagram-container { display: flex; justify-content: center; overflow: auto; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<h1>DarTounsi — Sprint 2: Intelligent Discovery</h1>
<h2>Activity Diagram — Property Discovery &amp; Rental Flow (UML 2.0)</h2>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1100" width="950" height="1100">

  <!-- Swimlanes -->
  <rect x="30" y="40" width="280" height="1030" fill="#fef9f0" stroke="#e85d04" stroke-width="1.5" rx="5"/>
  <text x="170" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#e85d04">Tenant / Student</text>

  <rect x="310" y="40" width="280" height="1030" fill="#f0f8ff" stroke="#4a90d9" stroke-width="1.5" rx="5"/>
  <text x="450" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">SPA Frontend</text>

  <rect x="590" y="40" width="330" height="1030" fill="#f0fff0" stroke="#2e7d32" stroke-width="1.5" rx="5"/>
  <text x="755" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Backend (API + DB)</text>

  <!-- Initial node -->
  <circle cx="170" cy="100" r="10" fill="#333"/>
  <line x1="170" y1="110" x2="170" y2="130" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,130 170,140 175,130" fill="#333"/>

  <!-- Navigate to Search -->
  <rect x="95" y="140" width="150" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#333">Navigate to Search</text>

  <!-- Decision: Apply filters? -->
  <line x1="170" y1="176" x2="170" y2="200" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,200 170,210 175,200" fill="#333"/>
  <polygon points="170,212 210,237 170,262 130,237" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="240" text-anchor="middle" font-size="10" fill="#333">Filters?</text>

  <!-- Yes: Set filters -->
  <line x1="170" y1="262" x2="170" y2="285" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,285 170,295 175,285" fill="#333"/>
  <text x="180" y="280" font-size="9" fill="#555">[Yes]</text>

  <rect x="85" y="295" width="170" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="310" text-anchor="middle" font-size="10" fill="#333">Set Filters (city, type,</text>
  <text x="170" y="322" text-anchor="middle" font-size="10" fill="#333">price, furnished, beds)</text>

  <!-- No: Skip to search -->
  <line x1="210" y1="237" x2="310" y2="237" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="230" font-size="9" fill="#555">[No]</text>

  <!-- Fork bar - parallel search -->
  <line x1="245" y1="313" x2="380" y2="313" stroke="#333" stroke-width="1.5"/>
  <polygon points="380,308 390,313 380,318" fill="#333"/>

  <!-- Frontend: Call API -->
  <rect x="375" y="295" width="150" height="36" rx="18" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="310" text-anchor="middle" font-size="10" fill="#333">Call Properties API</text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#333">with filters</text>

  <!-- No path joins -->
  <line x1="310" y1="237" x2="450" y2="237" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="237" x2="450" y2="295" stroke="#333" stroke-width="1.5"/>
  <polygon points="445,295 450,305 455,295" fill="#333"/>

  <!-- Send to backend -->
  <line x1="525" y1="313" x2="660" y2="313" stroke="#333" stroke-width="1.5"/>
  <polygon points="660,308 670,313 660,318" fill="#333"/>

  <rect x="660" y="295" width="160" height="36" rx="18" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="310" text-anchor="middle" font-size="10" fill="#333">Query Properties</text>
  <text x="740" y="322" text-anchor="middle" font-size="10" fill="#333">with JOIN + filters</text>

  <!-- Return results -->
  <line x1="740" y1="331" x2="740" y2="355" stroke="#333" stroke-width="1.5"/>
  <polygon points="735,355 740,365 745,355" fill="#333"/>

  <rect x="660" y="365" width="160" height="36" rx="18" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="380" text-anchor="middle" font-size="10" fill="#333">Apply Pagination</text>
  <text x="740" y="392" text-anchor="middle" font-size="10" fill="#333">&amp; Sort</text>

  <line x1="660" y1="383" x2="525" y2="383" stroke="#333" stroke-width="1.5"/>
  <polygon points="525,378 515,383 525,388" fill="#333"/>

  <!-- Render cards -->
  <rect x="375" y="370" width="150" height="36" rx="18" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" font-size="10" fill="#333">Render 3D Animated</text>
  <text x="450" y="397" text-anchor="middle" font-size="10" fill="#333">Property Cards</text>

  <!-- Display to user -->
  <line x1="375" y1="388" x2="245" y2="388" stroke="#333" stroke-width="1.5"/>
  <polygon points="245,383 235,388 245,393" fill="#333"/>

  <rect x="85" y="375" width="160" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="165" y="397" text-anchor="middle" font-size="11" fill="#333">View Property Cards</text>

  <!-- Decision: Select property? -->
  <line x1="170" y1="411" x2="170" y2="435" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,435 170,445 175,435" fill="#333"/>
  <polygon points="170,447 210,472 170,497 130,472" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="475" text-anchor="middle" font-size="10" fill="#333">Click</text>
  <text x="170" y="487" text-anchor="middle" font-size="10" fill="#333">card?</text>

  <!-- Yes -->
  <line x1="170" y1="497" x2="170" y2="520" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,520 170,530 175,520" fill="#333"/>
  <text x="185" y="515" font-size="9" fill="#555">[Yes]</text>

  <rect x="85" y="530" width="170" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="552" text-anchor="middle" font-size="11" fill="#333">Click Property Card</text>

  <!-- Fetch details -->
  <line x1="255" y1="548" x2="375" y2="548" stroke="#333" stroke-width="1.5"/>
  <polygon points="375,543 385,548 375,553" fill="#333"/>

  <rect x="375" y="530" width="150" height="36" rx="18" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="552" text-anchor="middle" font-size="10" fill="#333">Fetch Property Details</text>

  <line x1="525" y1="548" x2="660" y2="548" stroke="#333" stroke-width="1.5"/>
  <polygon points="660,543 670,548 660,553" fill="#333"/>

  <rect x="660" y="530" width="160" height="36" rx="18" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="545" text-anchor="middle" font-size="10" fill="#333">SELECT property +</text>
  <text x="740" y="557" text-anchor="middle" font-size="10" fill="#333">reviews + safety</text>

  <line x1="660" y1="548" x2="525" y2="570" stroke="#333" stroke-width="1.2"/>

  <!-- Render detail page -->
  <rect x="375" y="572" width="150" height="36" rx="18" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="594" text-anchor="middle" font-size="10" fill="#333">Render Detail Page</text>

  <line x1="375" y1="590" x2="245" y2="590" stroke="#333" stroke-width="1.5"/>
  <polygon points="245,585 235,590 245,595" fill="#333"/>

  <rect x="85" y="580" width="160" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="165" y="595" text-anchor="middle" font-size="10" fill="#333">View Details +</text>
  <text x="165" y="607" text-anchor="middle" font-size="10" fill="#333">WhatsApp + Reviews</text>

  <!-- Decision: Action? -->
  <line x1="170" y1="616" x2="170" y2="640" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,640 170,650 175,640" fill="#333"/>
  <polygon points="170,652 220,682 170,712 120,682" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="685" text-anchor="middle" font-size="9" fill="#333">Action?</text>

  <!-- Request to Rent -->
  <line x1="170" y1="712" x2="170" y2="740" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,740 170,750 175,740" fill="#333"/>
  <text x="180" y="735" font-size="9" fill="#555">[Rent]</text>

  <rect x="85" y="750" width="170" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="772" text-anchor="middle" font-size="10" fill="#333">Send Rental Request</text>

  <line x1="255" y1="768" x2="375" y2="768" stroke="#333" stroke-width="1.5"/>
  <polygon points="375,763 385,768 375,773" fill="#333"/>

  <rect x="375" y="750" width="150" height="36" rx="18" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="772" text-anchor="middle" font-size="10" fill="#333">POST rental request</text>

  <line x1="525" y1="768" x2="660" y2="768" stroke="#333" stroke-width="1.5"/>
  <polygon points="660,763 670,768 660,773" fill="#333"/>

  <rect x="660" y="750" width="160" height="36" rx="18" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="765" text-anchor="middle" font-size="10" fill="#333">INSERT request +</text>
  <text x="740" y="777" text-anchor="middle" font-size="10" fill="#333">Notify Owner</text>

  <!-- Toggle Favorite path -->
  <line x1="220" y1="682" x2="285" y2="682" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="675" font-size="9" fill="#555">[Fav]</text>

  <rect x="85" y="820" width="170" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="842" text-anchor="middle" font-size="10" fill="#333">Toggle Favorite ❤</text>
  <line x1="285" y1="682" x2="285" y2="838" stroke="#333" stroke-width="1.5"/>
  <line x1="285" y1="838" x2="255" y2="838" stroke="#333" stroke-width="1.5"/>
  <polygon points="255,833 245,838 255,843" fill="#333"/>

  <!-- Review path -->
  <line x1="120" y1="682" x2="60" y2="682" stroke="#333" stroke-width="1.5"/>
  <text x="65" y="675" font-size="9" fill="#555">[Review]</text>
  <line x1="60" y1="682" x2="60" y2="900" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="900" x2="85" y2="900" stroke="#333" stroke-width="1.5"/>
  <polygon points="85,895 95,900 85,905" fill="#333"/>

  <rect x="85" y="885" width="170" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="907" text-anchor="middle" font-size="10" fill="#333">Submit Review &amp; Rating</text>

  <!-- Merge -->
  <line x1="170" y1="786" x2="170" y2="820" stroke="#333" stroke-width="1.5"/>

  <!-- All paths merge -->
  <line x1="170" y1="856" x2="170" y2="960" stroke="#333" stroke-width="1.5"/>
  <line x1="170" y1="921" x2="170" y2="960" stroke="#333" stroke-width="1.5"/>

  <!-- Merge diamond -->
  <polygon points="170,958 190,970 170,982 150,970" fill="#333"/>

  <!-- Continue browsing? -->
  <line x1="170" y1="982" x2="170" y2="1005" stroke="#333" stroke-width="1.5"/>
  <polygon points="165,1005 170,1015 175,1005" fill="#333"/>

  <rect x="95" y="1015" width="150" height="36" rx="18" fill="#fff" stroke="#e85d04" stroke-width="1.5"/>
  <text x="170" y="1037" text-anchor="middle" font-size="11" fill="#333">Continue Browsing</text>

  <!-- Final node -->
  <line x1="170" y1="1051" x2="170" y2="1058" stroke="#333" stroke-width="1.5"/>
  <circle cx="170" cy="1065" r="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="170" cy="1065" r="5" fill="#333"/>

  <!-- No path from Click card decision -->
  <line x1="130" y1="472" x2="60" y2="472" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="465" font-size="9" fill="#555">[No]</text>
  <line x1="60" y1="472" x2="60" y2="970" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="60" y1="970" x2="150" y2="970" stroke="#333" stroke-width="1.5"/>

</svg>
</div>
</body>
</html>
