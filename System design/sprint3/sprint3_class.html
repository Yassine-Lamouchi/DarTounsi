<!DOCTYPE html>

<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }

<body>
<h1>DarTounsi — Sprint 3: AI Matchmaking &amp; Payments</h1>
<h2>Class Diagram (UML 2.0)</h2>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830">
  <defs>
    <marker id="diamond-filled" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 5, 7 0, 14 5, 7 10" fill="#333" stroke="#333" stroke-width="1"/>

    <marker id="arrow-dep" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1.2"/>

  </defs>

  <!-- ===== MatchResult Class ===== -->
  <rect x="30" y="30" width="310" height="220" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <rect x="30" y="30" width="310" height="35" rx="4" fill="#e85d04"/>
  <text x="185" y="53" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">MatchResult</text>
  <line x1="30" y1="65" x2="340" y2="65" stroke="#e85d04" stroke-width="1"/>
  <text x="40" y="83" font-size="11" fill="#333">- id : int</text>
  <text x="40" y="98" font-size="11" fill="#333">- user_a_id : int</text>
  <text x="40" y="113" font-size="11" fill="#333">- user_b_id : int</text>
  <text x="40" y="128" font-size="11" fill="#333">- compatibility_score : decimal(5,2)</text>
  <text x="40" y="143" font-size="11" fill="#333">- score_breakdown : JSON</text>
  <text x="40" y="158" font-size="11" fill="#333">  {sleep, noise, smoking, pets,</text>
  <text x="40" y="173" font-size="11" fill="#333">   cleanliness, guests, budget, location}</text>
  <text x="40" y="188" font-size="11" fill="#333">- created_at : datetime</text>
  <line x1="30" y1="198" x2="340" y2="198" stroke="#e85d04" stroke-width="1"/>
  <text x="40" y="216" font-size="11" fill="#333">+ getMatches(userId) : MatchResult[]</text>
  <text x="40" y="231" font-size="11" fill="#333">+ calculateScore(profileA, profileB) : float</text>

  <!-- ===== Payment Class ===== -->
  <rect x="30" y="290" width="310" height="230" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
  <rect x="30" y="290" width="310" height="35" rx="4" fill="#e85d04"/>
  <text x="185" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Payment</text>
  <line x1="30" y1="325" x2="340" y2="325" stroke="#e85d04" stroke-width="1"/>
  <text x="40" y="343" font-size="11" fill="#333">- id : int</text>
  <text x="40" y="358" font-size="11" fill="#333">- user_id : int</text>
  <text x="40" y="373" font-size="11" fill="#333">- property_id : int</text>
  <text x="40" y="388" font-size="11" fill="#333">- amount : decimal(10,2)</text>
  <text x="40" y="403" font-size="11" fill="#333">- currency : string {TND|EUR|USD}</text>
  <text x="40" y="418" font-size="11" fill="#333">- payment_method : string {konnect}</text>
  <text x="40" y="433" font-size="11" fill="#333">- status : «enum» {pending|completed|failed}</text>
  <text x="40" y="448" font-size="11" fill="#333">- transaction_ref : string</text>
  <text x="40" y="463" font-size="11" fill="#333">- created_at : datetime</text>
  <line x1="30" y1="473" x2="340" y2="473" stroke="#e85d04" stroke-width="1"/>
  <text x="40" y="491" font-size="11" fill="#333">+ createPayment(userId, propId, amount) : void</text>
  <text x="40" y="506" font-size="11" fill="#333">+ completePayment(txRef) : void</text>

  <rect x="30" y="560" width="310" height="35" rx="4" fill="#e85d04"/>

  <text x="40" y="673" font-size="11" fill="#333">- description : text</text>

  <text x="40" y="746" font-size="11" fill="#333">+ getScoreColor(score) : string</text>

  <text x="420" y="98" font-size="11" fill="#333">- reporter_id : int</text>
  <text x="420" y="113" font-size="11" fill="#333">- property_id : int</text>

  <text x="420" y="143" font-size="11" fill="#333">- details : text</text>
  <text x="420" y="158" font-size="11" fill="#333">- status : «enum» {pending|reviewed|resolved}</text>

  <text x="420" y="358" font-size="11" fill="#333">- user_id : int</text>

  <text x="420" y="403" font-size="11" fill="#333">- message : text</text>
  <text x="420" y="418" font-size="11" fill="#333">- is_read : boolean</text>
  <line x1="410" y1="425" x2="710" y2="425" stroke="#e85d04" stroke-width="1"/>

  <text x="790" y="436" font-size="11" fill="#333">+ isAdminOrSuper() : boolean</text>

  <!-- ===== Property (simplified ref) ===== -->
  <rect x="780" y="490" width="310" height="120" rx="4" fill="#fff8f0" stroke="#e85d04" stroke-width="2"/>
