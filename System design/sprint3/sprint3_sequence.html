<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarTounsi — Sprint 3: Sequence Diagram</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 5px; }
  h2 { text-align: center; font-size: 14px; color: #666; font-weight: normal; margin-top: 0; }
  .diagram-container { display: flex; justify-content: center; overflow: auto; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<h1>DarTounsi — Sprint 3: AI Matchmaking &amp; Payments</h1>
<h2>Sequence Diagram — SamsarBot, Matching &amp; Admin Approval (UML 2.0)</h2>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1050" width="1100" height="1050">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <rect x="30" y="30" width="100" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:User</text>
  <line x1="80" y1="65" x2="80" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="180" y="30" width="120" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="240" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:SPA (app.js)</text>
  <line x1="240" y1="65" x2="240" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="370" y="30" width="120" height="35" rx="4" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="430" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:SamsarBot</text>
  <line x1="430" y1="65" x2="430" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="550" y="30" width="120" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="610" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:API (api.php)</text>
  <line x1="610" y1="65" x2="610" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="740" y="30" width="100" height="35" rx="4" fill="#e85d04" stroke="#c44d03" stroke-width="1.5"/>
  <text x="790" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:Database</text>
  <line x1="790" y1="65" x2="790" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="910" y="30" width="100" height="35" rx="4" fill="#4a90d9" stroke="#357abd" stroke-width="1.5"/>
  <text x="960" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">:Admin</text>
  <line x1="960" y1="65" x2="960" y2="1030" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== Fragment 1: SamsarBot Interaction ===== -->
  <rect x="20" y="85" width="540" height="220" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="85" width="40" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">sd</text>
  <text x="70" y="100" font-size="10" fill="#555">SamsarBot AI Interaction</text>

  <rect x="75" y="110" width="10" height="180" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="235" y="115" width="10" height="170" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="425" y="130" width="10" height="130" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>

  <!-- 1. Open SamsarBot -->
  <line x1="85" y1="120" x2="235" y2="120" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="100" y="115" font-size="10" fill="#333">1: click SamsarBot floating button</text>

  <!-- 2. Show contextual suggestions -->
  <line x1="245" y1="135" x2="425" y2="135" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="260" y="130" font-size="10" fill="#333">2: getContextualSuggestions(currentPage)</text>

  <line x1="425" y1="155" x2="245" y2="155" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="260" y="152" font-size="10" fill="#555">3: page-specific suggestions[]</text>

  <line x1="235" y1="175" x2="85" y2="175" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="100" y="172" font-size="10" fill="#555">4: render suggestion buttons</text>

  <!-- 5. User sends message -->
  <line x1="85" y1="195" x2="235" y2="195" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="100" y="190" font-size="10" fill="#333">5: sendMessage("How do I find roommates?")</text>

  <!-- 6. Process via keyword matching -->
  <line x1="245" y1="210" x2="425" y2="210" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="260" y="205" font-size="10" fill="#333">6: processMessage(input)</text>

  <!-- Self: match keywords -->
  <line x1="435" y1="225" x2="480" y2="225" stroke="#333" stroke-width="1"/>
  <line x1="480" y1="225" x2="480" y2="240" stroke="#333" stroke-width="1"/>
  <line x1="480" y1="240" x2="435" y2="240" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="485" y="235" font-size="9" fill="#555">7: matchKeywords()</text>

  <line x1="425" y1="255" x2="245" y2="255" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="260" y="252" font-size="10" fill="#555">8: matched response from FAQ DB</text>

  <line x1="235" y1="275" x2="85" y2="275" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="100" y="272" font-size="10" fill="#555">9: display bot response in chat bubble</text>

  <!-- ===== Fragment 2: Roommate Matching ===== -->
  <rect x="20" y="325" width="820" height="250" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="325" width="40" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">sd</text>
  <text x="70" y="340" font-size="10" fill="#555">Roommate Matching &amp; Compatibility</text>

  <rect x="75" y="355" width="10" height="205" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="235" y="360" width="10" height="195" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="605" y="375" width="10" height="140" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="785" y="385" width="10" height="100" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <!-- Navigate to matchmaking -->
  <line x1="85" y1="365" x2="235" y2="365" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="100" y="360" font-size="10" fill="#333">1: navigate(#/matchmaking)</text>

  <line x1="245" y1="380" x2="605" y2="380" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="375" font-size="10" fill="#333">2: GET route=matchmaking&amp;action=matches</text>

  <line x1="615" y1="390" x2="785" y2="390" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="385" font-size="10" fill="#333">3: SELECT match_results JOIN users</text>

  <line x1="785" y1="420" x2="615" y2="420" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="640" y="417" font-size="10" fill="#555">4: matches[] with scores &amp; breakdown</text>

  <!-- Self: calculate any new scores -->
  <line x1="615" y1="440" x2="660" y2="440" stroke="#333" stroke-width="1"/>
  <line x1="660" y1="440" x2="660" y2="458" stroke="#333" stroke-width="1"/>
  <line x1="660" y1="458" x2="615" y2="458" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="665" y="452" font-size="9" fill="#555">5: calculate new scores</text>

  <!-- Store new results -->
  <line x1="615" y1="470" x2="785" y2="470" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="640" y="467" font-size="10" fill="#333">6: INSERT match_results (new pairs)</text>

  <line x1="605" y1="500" x2="245" y2="500" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="340" y="497" font-size="10" fill="#555">7: {data: matches[] with breakdown JSON}</text>

  <!-- Render match cards -->
  <line x1="235" y1="520" x2="85" y2="520" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="100" y="517" font-size="10" fill="#555">8: render compatibility cards (92%, 85% ...)</text>

  <!-- Show breakdown -->
  <line x1="85" y1="540" x2="235" y2="540" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="100" y="535" font-size="10" fill="#333">9: click "View Breakdown"</text>

  <line x1="235" y1="555" x2="85" y2="555" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="100" y="552" font-size="10" fill="#555">10: show criteria breakdown (sleep, noise, pets...)</text>

  <!-- ===== Fragment 3: Admin Approval Flow ===== -->
  <rect x="20" y="600" width="970" height="260" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="600" width="40" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="615" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">sd</text>
  <text x="70" y="615" font-size="10" fill="#555">Admin Property Approval Flow</text>

  <rect x="955" y="630" width="10" height="215" fill="#bbdefb" stroke="#4a90d9" stroke-width="1"/>
  <rect x="605" y="645" width="10" height="165" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="785" y="656" width="10" height="120" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="75" y="800" width="10" height="45" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <!-- Admin views pending -->
  <line x1="965" y1="640" x2="615" y2="650" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="730" y="640" font-size="10" fill="#333">1: GET route=admin&amp;action=properties&amp;status=pending</text>

  <line x1="615" y1="660" x2="785" y2="660" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="655" font-size="10" fill="#333">2: SELECT properties WHERE status='pending'</text>

  <line x1="785" y1="685" x2="615" y2="685" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="640" y="682" font-size="10" fill="#555">3: pending properties[]</text>

  <line x1="605" y1="700" x2="955" y2="700" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="730" y="697" font-size="10" fill="#555">4: render pending listings for review</text>

  <!-- Admin approves -->
  <line x1="955" y1="720" x2="615" y2="720" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="700" y="715" font-size="10" fill="#333">5: POST route=admin&amp;action=approve-property&amp;status=active</text>

  <line x1="615" y1="740" x2="785" y2="740" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="735" font-size="10" fill="#333">6: UPDATE properties SET status='active'</text>

  <line x1="785" y1="760" x2="615" y2="760" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="650" y="757" font-size="10" fill="#555">7: success</text>

  <!-- Notify owner -->
  <line x1="615" y1="780" x2="785" y2="780" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="775" font-size="10" fill="#333">8: INSERT notification (owner, "Property Approved")</text>

  <line x1="605" y1="800" x2="955" y2="800" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="730" y="797" font-size="10" fill="#555">9: {message: "Property status: active"}</text>

  <!-- Owner receives notification (via polling) -->
  <line x1="605" y1="815" x2="85" y2="815" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="250" y="812" font-size="10" fill="#333">10: toast notification: "Your property has been approved!"</text>

  <!-- ===== Fragment 4: Toast Notification Polling ===== -->
  <rect x="20" y="880" width="820" height="135" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="880" width="55" height="22" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="47" y="895" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">loop</text>
  <text x="85" y="895" font-size="10" fill="#555">[every 30 seconds]</text>

  <rect x="235" y="910" width="10" height="90" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="605" y="920" width="10" height="45" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>
  <rect x="785" y="925" width="10" height="25" fill="#ffe0b2" stroke="#e85d04" stroke-width="1"/>

  <!-- Self: poll timer fires -->
  <line x1="245" y1="915" x2="290" y2="915" stroke="#333" stroke-width="1"/>
  <line x1="290" y1="915" x2="290" y2="918" stroke="#333" stroke-width="1"/>
  <line x1="290" y1="918" x2="245" y2="918" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="295" y="915" font-size="9" fill="#555">pollNotifications()</text>

  <line x1="245" y1="925" x2="605" y2="925" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="920" font-size="10" fill="#333">1: GET route=notifications&amp;action=count</text>

  <line x1="615" y1="930" x2="785" y2="930" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="927" font-size="10" fill="#333">2: SELECT COUNT(*) WHERE is_read=0</text>

  <line x1="785" y1="945" x2="615" y2="945" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="660" y="942" font-size="10" fill="#555">3: count</text>

  <line x1="605" y1="960" x2="245" y2="960" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="340" y="957" font-size="10" fill="#555">4: {count: N}</text>

  <!-- Update badge -->
  <line x1="235" y1="980" x2="85" y2="980" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
  <text x="100" y="977" font-size="10" fill="#555">5: update badge counter + show toast if new</text>

</svg>
</div>
</body>
</html>
